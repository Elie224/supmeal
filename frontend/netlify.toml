[build]
  base = "."
  command = "npm run build --prefix frontend"
  publish = "frontend/dist"

[[redirects]]
  from = "/api/*"
  to = "https://supmeal-api-elisee.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://supmeal-api-elisee.fly.dev/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
